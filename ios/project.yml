name: TripBudget
options:
  bundleIdPrefix: com.tripbudget
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  defaultConfig: Debug
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    # Personal team (gaolei0811@gmail.com). Set so that opening the project and
    # pressing Run on a phone works without picking a team by hand; change it to
    # your own team in Xcode → Signing & Capabilities if you fork this.
    DEVELOPMENT_TEAM: "JD4B775BJ5"

targets:
  TripBudget:
    type: application
    platform: iOS
    sources:
      - path: TripBudget
    # A real Info.plist is needed for two things a generated one cannot express:
    # App Transport Security for talking to the dev server on the LAN, and the
    # local-network usage description (iOS 14+ blocks LAN access without it).
    info:
      path: TripBudget/Info.plist
      properties:
        CFBundleDisplayName: 共享记账
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: 需要用麦克风把你说的话变成账目。
        NSSpeechRecognitionUsageDescription: 需要语音识别权限，才能听懂你说了多少钱、谁付的钱。
        NSLocalNetworkUsageDescription: 需要访问局域网，才能连上你电脑上运行的记账服务。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The dev server address baked into a *device* build (the Simulator
        # ignores this and uses 127.0.0.1). It is only a first-run default: once
        # the app has been opened on the phone, the address set in
        # 「账本 → 我 → 服务器地址」 wins, so changing Wi-Fi never needs a rebuild.
        TRIP_BUDGET_API: "http://192.168.3.84:4000"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaolei.tripbudget
        PRODUCT_NAME: TripBudget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES

  TripBudgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TripBudgetTests
    dependencies:
      - target: TripBudget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaolei.tripbudget.tests
        GENERATE_INFOPLIST_FILE: YES

  TripBudgetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TripBudgetUITests
    dependencies:
      - target: TripBudget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaolei.tripbudget.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TripBudget

schemes:
  TripBudget:
    build:
      targets:
        TripBudget: all
        TripBudgetTests: [test]
        TripBudgetUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TripBudgetTests
        - TripBudgetUITests
