name: TripBudget
options:
  bundleIdPrefix: com.tripbudget
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  defaultConfig: Debug
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  TripBudget:
    type: application
    platform: iOS
    sources:
      - path: TripBudget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tripbudget.app
        PRODUCT_NAME: TripBudget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 共享记账
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 需要用麦克风把你说的话变成账目。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 需要语音识别权限，才能听懂你说了多少钱、谁付的钱。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES

  TripBudgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TripBudgetTests
    dependencies:
      - target: TripBudget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tripbudget.app.tests
        GENERATE_INFOPLIST_FILE: YES

  TripBudgetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TripBudgetUITests
    dependencies:
      - target: TripBudget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tripbudget.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TripBudget

schemes:
  TripBudget:
    build:
      targets:
        TripBudget: all
        TripBudgetTests: [test]
        TripBudgetUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TripBudgetTests
        - TripBudgetUITests
